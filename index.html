<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlimCAT — UI Recreation</title>
<style>
:root{--bg:#080a0f;--panel:#10141d;--panel2:#151b27;--line:#263044;--text:#edf2fb;--muted:#8995aa;--accent:#b7f34a;--accent2:#8fc92f;--danger:#ff647c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#17202d 0%,#090c12 52%,#050609 100%);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
button,input{font:inherit}.app{width:min(100%,920px);min-height:570px;background:rgba(10,13,20,.96);border:1px solid #293244;border-radius:16px;box-shadow:0 28px 100px #000a,0 0 0 1px #ffffff05 inset;overflow:hidden;display:grid;grid-template-columns:220px 1fr}
.sidebar{background:#0d1119;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px 18px;border-bottom:1px solid var(--line)}.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#11170a;display:grid;place-items:center;font-weight:950;font-size:18px;box-shadow:0 0 24px #b7f34a22}.brand strong{display:block;letter-spacing:1.6px;font-size:14px}.brand small{color:var(--muted);font-size:10px;letter-spacing:1.4px}.navlabel{font-size:10px;color:#647087;letter-spacing:1.7px;padding:0 10px;margin-bottom:6px}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:#aeb9ca;padding:11px 12px;border-radius:9px;text-align:left;display:flex;align-items:center;gap:11px;cursor:pointer;transition:.15s}.nav button:hover{background:#171e2a;color:#fff}.nav button.active{background:#b7f34a12;border-color:#b7f34a35;color:var(--accent)}.ico{width:19px;text-align:center;font-size:16px}.sidebar-foot{margin-top:auto;border:1px solid var(--line);background:#111722;border-radius:10px;padding:12px}.status{display:flex;align-items:center;gap:7px;color:#c7d0de;font-size:11px}.dot{width:7px;height:7px;background:var(--accent);border-radius:50%;box-shadow:0 0 9px #b7f34a88}.sidebar-foot p{color:var(--muted);font-size:10px;margin:7px 0 0}
main{padding:26px 28px 24px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:19px;gap:12px}.eyebrow{font-size:10px;letter-spacing:1.8px;color:var(--accent);text-transform:uppercase}.topbar h1{margin:5px 0 0;font-size:25px;letter-spacing:-.7px}.userpill{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#121722;color:#dce3ee;font-size:11px}.avatar{width:27px;height:27px;border-radius:8px;background:#273344;color:var(--accent);display:grid;place-items:center;font-weight:800}.content{padding-top:21px}.intro{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.intro h2{font-size:17px;margin:0 0 5px}.intro p{margin:0;color:var(--muted);font-size:12px}.tag{border:1px solid #b7f34a44;background:#b7f34a0d;color:var(--accent);font-size:10px;border-radius:6px;padding:5px 8px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{border:1px solid var(--line);background:linear-gradient(145deg,#141a25,#0f131c);border-radius:10px;padding:13px}.stat span{color:var(--muted);font-size:10px;letter-spacing:.7px;text-transform:uppercase}.stat strong{display:block;font-size:19px;margin-top:5px}.stat em{font-style:normal;color:var(--accent);font-size:10px;margin-left:5px}
.panel{border:1px solid var(--line);background:#0e131c;border-radius:12px;overflow:hidden}.panelhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.panelhead strong{font-size:12px;letter-spacing:.3px}.panelhead small{color:var(--muted);font-size:10px}.rows{padding:4px 12px}.item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 5px;border-bottom:1px solid #1c2534}.item:last-child{border-bottom:0}.item-title{font-size:12px;font-weight:650}.item-desc{font-size:10px;color:var(--muted);margin-top:3px}.control{display:flex;align-items:center;gap:9px;flex-shrink:0}.switch{appearance:none;width:35px;height:20px;background:#2a3445;border:1px solid #3a4558;border-radius:20px;position:relative;cursor:pointer;transition:.2s}.switch:before{content:"";position:absolute;width:12px;height:12px;border-radius:50%;left:3px;top:3px;background:#9ba6b7;transition:.2s}.switch:checked{background:#b7f34a33;border-color:#b7f34a99}.switch:checked:before{left:18px;background:var(--accent);box-shadow:0 0 8px #b7f34a55}.select{background:#151c28;color:#dce5f2;border:1px solid #303b4f;border-radius:7px;padding:7px 9px;font-size:11px;max-width:150px}.action{background:#b7f34a;color:#101509;border:0;border-radius:7px;padding:8px 12px;font-weight:800;font-size:11px;cursor:pointer}.action:hover{background:#c9ff6a}.action.secondary{background:#182131;color:#d5dfed;border:1px solid #344158}.action.secondary:hover{background:#202b3e}.search{width:100%;background:#121925;border:1px solid #2a3548;border-radius:8px;padding:10px 12px;color:var(--text);outline:none;margin-bottom:12px}.search:focus{border-color:#b7f34a88}.list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.listcard{border:1px solid var(--line);background:#121823;border-radius:9px;padding:11px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.listcard span{font-size:11px}.listcard button{border:1px solid #344158;background:#1b2635;color:#cbd6e5;border-radius:6px;padding:5px 8px;font-size:10px;cursor:pointer}.notice{border:1px solid #b7f34a33;background:#b7f34a0b;color:#c7d9ac;border-radius:9px;padding:11px 12px;font-size:11px;margin-top:13px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#172131;border:1px solid #3a4b62;border-radius:9px;padding:11px 16px;box-shadow:0 12px 40px #0008;color:#e8eff8;font-size:12px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.footer{display:flex;justify-content:space-between;color:#66738a;font-size:10px;padding:17px 2px 0}.kbd{border:1px solid #354156;background:#161e2b;padding:2px 6px;border-radius:4px;color:#b6c1d2}
@media(max-width:650px){body{padding:0;display:block}.app{width:100%;min-height:100vh;border-radius:0;grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:13px;gap:12px}.brand{padding-bottom:12px}.navlabel,.sidebar-foot{display:none}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap;padding:9px}.nav button .ico{display:none}main{padding:20px 15px}.topbar h1{font-size:22px}.userpill{padding:6px}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:16px}.list{grid-template-columns:1fr}.footer{padding-bottom:20px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">S</div><div><strong>SLIMCAT</strong><small>CONTROL CENTER</small></div></div>
  <div><div class="navlabel">MAIN MENU</div><nav class="nav" id="nav">
    <button class="active" data-page="overview"><span class="ico">◈</span>Overview</button>
    <button data-page="player"><span class="ico">♙</span>Player</button>
    <button data-page="appearance"><span class="ico">◉</span>Appearance</button>
    <button data-page="vehicles"><span class="ico">▰</span>Vehicles</button>
    <button data-page="weapons"><span class="ico">⌁</span>Loadout catalog</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings</button>
  </nav></div>
  <div class="sidebar-foot"><div class="status"><span class="dot"></span> Interface ready</div><p>Browser demo · no game connection</p></div>
</aside>
<main>
  <header class="topbar"><div><div class="eyebrow">SlimCAT / <span id="crumb">Overview</span></div><h1 id="heading">Welcome back.</h1></div><div class="userpill"><div class="avatar">U</div><div><strong>Guest User</strong><div style="color:#8995aa;font-size:10px">Local preview</div></div></div></header>
  <section class="content" id="content"></section>
  <div class="footer"><span>SLIMCAT UI RECREATION</span><span>Navigation <span class="kbd">↑</span> <span class="kbd">↓</span> · Select <span class="kbd">Enter</span></span></div>
</main>
</div>
<div class="toast" id="toast">Saved locally for this preview.</div>
<script>
const pages={
overview:{title:"Welcome back.",eyebrow:"Overview",html:`<div class="intro"><div><h2>Control center</h2><p>A recreation of the SlimCAT menu style, built as a standalone browser preview.</p></div><span class="tag">UI PREVIEW</span></div><div class="stats"><div class="stat"><span>Interface</span><strong>Online <em>●</em></strong></div><div class="stat"><span>Active section</span><strong id="activeStat">Overview</strong></div><div class="stat"><span>Build</span><strong>1.0.0</strong></div></div><div class="panel"><div class="panelhead"><strong>QUICK SETTINGS</strong><small>Interactive demo</small></div><div class="rows">${row("Compact layout","Reduce visual spacing for a denser menu",`<input class="switch" type="checkbox" data-setting="Compact layout">`)}${row("UI animations","Enable subtle interface transitions",`<input class="switch" type="checkbox" checked data-setting="UI animations">`)}${row("Accent color","Choose the interface highlight",`<select class="select" data-setting="Accent color"><option>Lime</option><option>Cyan</option><option>Violet</option><option>Orange</option></select>`)}</div></div><div class="notice">This standalone recreation previews the interface only. It does not connect to FiveM or run game actions.</div>`},
player:{title:"Player controls",eyebrow:"Player",html:`<div class="intro"><div><h2>Player preferences</h2><p>Toggle sample interface options and adjust demo values.</p></div><span class="tag">LOCAL ONLY</span></div><div class="panel"><div class="panelhead"><strong>PLAYER OPTIONS</strong><small>Preview controls</small></div><div class="rows">${row("Show player status","Display status indicators in the menu",`<input class="switch" type="checkbox" checked data-setting="Show player status">`)}${row("Show notifications","Allow demo toast messages",`<input class="switch" type="checkbox" checked data-setting="Show notifications">`)}${row("Menu scale","Adjust the sample menu scale",`<select class="select" data-setting="Menu scale"><option>90%</option><option selected>100%</option><option>110%</option><option>120%</option></select>`)}</div></div>`},
appearance:{title:"Appearance",eyebrow:"Appearance",html:`<div class="intro"><div><h2>Personalize the interface</h2><p>Choose a visual style for this browser preview.</p></div></div><div class="panel"><div class="panelhead"><strong>THEME OPTIONS</strong><small>Apply instantly</small></div><div class="rows">${row("Glow effects","Highlight active interface elements",`<input class="switch" type="checkbox" checked data-setting="Glow effects">`)}${row("Rounded corners","Use rounded panels and controls",`<input class="switch" type="checkbox" checked data-setting="Rounded corners">`)}${row("Accent color","Select your preferred accent",`<select class="select" data-setting="Accent color"><option>Lime</option><option>Cyan</option><option>Violet</option><option>Orange</option></select>`)}</div></div>`},
vehicles:{title:"Vehicle catalog",eyebrow:"Vehicles",html:`<div class="intro"><div><h2>Vehicle catalog</h2><p>Browse sample entries; actions are visual placeholders.</p></div><span class="tag">DEMO CATALOG</span></div><input class="search" id="filter" placeholder="Search vehicles..." autocomplete="off"><div class="list" id="catalog">${["Adder","Zentorno","Comet","Banshee","Sultan","Elegy RH8","Buffalo","Futo"].map(x=>card(x,"View details")).join("")}</div><div class="notice">Catalog buttons only show a preview message. No vehicle is spawned or controlled.</div>`},
weapons:{title:"Loadout catalog",eyebrow:"Loadout catalog",html:`<div class="intro"><div><h2>Item catalog</h2><p>A searchable sample catalog based on names in the supplied script.</p></div><span class="tag">BROWSER ONLY</span></div><input class="search" id="filter" placeholder="Search items..." autocomplete="off"><div class="list" id="catalog">${["Pistol","Combat Pistol","SMG","Assault Rifle","Carbine Rifle","Pump Shotgun","Heavy Sniper","Stun Gun","Knife","Baseball Bat","Grenade","Flashlight"].map(x=>card(x,"Inspect")).join("")}</div><div class="notice">This is a visual catalog only. It cannot grant weapons or interact with a game session.</div>`},
settings:{title:"Settings",eyebrow:"Settings",html:`<div class="intro"><div><h2>Application settings</h2><p>Configure the browser preview and keyboard behavior.</p></div></div><div class="panel"><div class="panelhead"><strong>GENERAL</strong><small>Saved in this page session</small></div><div class="rows">${row("Enable keyboard navigation","Use arrow keys to navigate menu sections",`<input class="switch" type="checkbox" checked data-setting="Keyboard navigation">`)}${row("Show confirmation messages","Display feedback after interactions",`<input class="switch" type="checkbox" checked data-setting="Show confirmation messages">`)}${row("Menu hotkey","Displayed for visual reference only",`<select class="select" data-setting="Menu hotkey"><option>H</option><option>F4</option><option>F7</option><option>F10</option></select>`)}</div></div><div style="display:flex;gap:8px;margin-top:13px"><button class="action" id="save">Save preferences</button><button class="action secondary" id="reset">Reset preview</button></div>`}
};
function row(title,desc,control){return `<div class="item"><div><div class="item-title">${title}</div><div class="item-desc">${desc}</div></div><div class="control">${control}</div></div>`}
function card(title,action){return `<div class="listcard" data-name="${title.toLowerCase()}"><span>${title}</span><button data-action="${title}">${action} ↗</button></div>`}
let current="overview", navIndex=0;
const content=document.getElementById("content"), heading=document.getElementById("heading"),crumb=document.getElementById("crumb");
function render(page){current=page;const p=pages[page];heading.textContent=p.title;crumb.textContent=p.eyebrow;content.innerHTML=p.html;document.querySelectorAll("#nav button").forEach((b,i)=>{b.classList.toggle("active",b.dataset.page===page);if(b.dataset.page===page)navIndex=i});document.querySelectorAll("[data-setting]").forEach(el=>el.addEventListener("change",()=>{if(el.dataset.setting==="Accent color")setAccent(el.value);notify(el.dataset.setting+" updated")}));const filter=document.getElementById("filter");if(filter)filter.addEventListener("input",()=>document.querySelectorAll(".listcard").forEach(c=>c.style.display=c.dataset.name.includes(filter.value.toLowerCase())?"flex":"none"));document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>notify(b.dataset.action+" selected — preview only")));const save=document.getElementById("save");if(save)save.onclick=()=>notify("Preferences saved for this preview");const reset=document.getElementById("reset");if(reset)reset.onclick=()=>{setAccent("Lime");render("overview");notify("Preview reset")};}
function setAccent(v){const colors={Lime:"#b7f34a",Cyan:"#55e7f2",Violet:"#b39aff",Orange:"#ffb45b"};document.documentElement.style.setProperty("--accent",colors[v]||colors.Lime);document.documentElement.style.setProperty("--accent2",colors[v]||colors.Lime)}
let toastTimer;function notify(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1900)}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(b)render(b.dataset.page)});
document.addEventListener("keydown",e=>{if(e.target.matches("input,select,textarea"))return;const buttons=[...document.querySelectorAll("#nav button")];if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();navIndex=(navIndex+(e.key==="ArrowDown"?1:-1)+buttons.length)%buttons.length;buttons[navIndex].focus()}else if(e.key==="Enter"&&document.activeElement.matches("#nav button")){render(document.activeElement.dataset.page)}else if(e.key==="Escape"){render("overview")}});
render("overview");
</script>
</body>
</html>
